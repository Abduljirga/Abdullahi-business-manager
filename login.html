<!doctype html>
<html lang="ha">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABDULLAHI IBRAHIM BUSINESS MANAGER — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f6fc;font:16px Arial,sans-serif;color:#17243a}
.card{width:min(430px,92vw);background:white;padding:30px;border-radius:18px;box-shadow:0 12px 40px #17365b18}
h1{font-size:21px;color:#102b55;margin:0 0 6px}.sub{color:#64748b;font-size:13px;margin:0 0 24px}
label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #d7e0eb;border-radius:9px;font-size:15px}
button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#1769d2;color:white;font-weight:bold;font-size:15px;cursor:pointer}
#msg{margin-top:14px;font-size:13px;line-height:1.5}.hint{font-size:12px;color:#64748b;margin-top:20px;line-height:1.5}
</style>
</head><body>
<div class="card">
<h1>ABDULLAHI IBRAHIM</h1><div class="sub">BUSINESS MANAGER • SECURE LOGIN</div>
<form id="loginForm">
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit" id="submitBtn">Shiga / Sign in</button>
</form>
<div id="msg" role="status"></div>
<div class="hint">Wannan shafin yana buƙatar Supabase project configuration. Ba a ƙirƙiri asusun admin ta wannan shafi ba; babban admin sai an kafa shi ta matakan setup masu tsaro.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const msg=document.getElementById('msg'), btn=document.getElementById('submitBtn');
function say(t,ok=false){msg.textContent=t;msg.style.color=ok?'#138a59':'#b42318'}
if(!window.APP_CONFIG || !APP_CONFIG.SUPABASE_URL || APP_CONFIG.SUPABASE_URL.includes('YOUR-')){
  say('Ba a saita Supabase ba tukuna. Bi SETUP_HAUSA.txt, sannan ka cike config.js.');
  btn.disabled=true;btn.style.opacity='.5';
}else{
 const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY);
 document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;btn.textContent='Ana shiga...';say('');
  const {data,error}=await client.auth.signInWithPassword({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value
  });
  if(error){say('An kasa shiga: '+error.message);btn.disabled=false;btn.textContent='Shiga / Sign in';return;}
  const {data:profile,error:pErr}=await client.from('profiles').select('full_name,role,branch_id,is_active').eq('id',data.user.id).single();
  if(pErr || !profile || !profile.is_active){
    await client.auth.signOut();say('Ba a ba wannan asusu izinin shiga ba. Tuntuɓi Super Admin.');btn.disabled=false;btn.textContent='Shiga / Sign in';return;
  }
  say('An shiga lafiya. Sannu '+(profile.full_name||data.user.email)+' — '+profile.role+'.',true);
  setTimeout(()=>location.href='portal.html',700);
 });
}
</script></body></html>
